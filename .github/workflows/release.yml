name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default: dependency install scripts must never run with a token that can change the repository
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Logic tests (updater, address bar)
        run: npm run test:update && npm run test:address

      - name: Build Linux AppImage
        run: npm run build:appimage

      - name: Smoke test (launch packaged app)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a release/linux-unpacked/freedom-browser --smoke-test --no-sandbox

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Freedom-Linux-AppImage
          path: release/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (Setup.exe) & zip
        run: npm run build:win

      - name: Smoke test (launch packaged app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\freedom-browser.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke.log
          Get-Content smoke.log
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      # Installer check on a real Windows: silent install, browser registration, Start menu,
      # launch of the installed app, silent uninstall cleans the registry
      - name: Installer test (install, registry, launch, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\*-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe was not built" }
          $p = Start-Process $setup.FullName -ArgumentList '/S', '/STARTUP' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          # The installer may hand over to an elevated copy of itself: wait for the Apps & features entry
          $roots = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entry = $null
          for ($i = 0; $i -lt 60 -and -not $entry; $i++) {
            $entry = Get-ChildItem $roots -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Freedom Browser*' } | Select-Object -First 1
            if (-not $entry) { Start-Sleep 2 }
          }
          if (-not $entry) { throw 'Not listed in Apps & features' }
          $un = $entry.UninstallString -replace '^"([^"]+)".*$', '$1'
          $dir = Split-Path $un -Parent
          Write-Host "Installed: $($entry.DisplayName) $($entry.DisplayVersion) in $dir ($($entry.PSParentPath))"
          $exe = "$dir\freedom-browser.exe"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $exe); $i++) { Start-Sleep 2 }
          if (-not (Test-Path $exe)) { Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 20 | Format-Table Name; throw "Not installed at $exe" }
          if ($entry.PSParentPath -notlike '*HKEY_LOCAL_MACHINE*') { throw 'Installed per-user instead of for all users' }
          $caps = 'HKLM:\Software\Clients\StartMenuInternet\Freedom Browser\Capabilities'
          if ((Get-ItemProperty "$caps\URLAssociations").https -ne 'FreedomBrowserURL') { throw 'https association missing' }
          if (-not (Get-ItemProperty 'HKLM:\Software\RegisteredApplications').'Freedom Browser') { throw 'RegisteredApplications entry missing' }
          $cmd = (Get-ItemProperty 'HKLM:\Software\Classes\FreedomBrowserURL\shell\open\command').'(default)'
          Write-Host "URL handler: $cmd"
          if ($cmd -notlike "*freedom-browser.exe*") { throw 'URL handler command is wrong' }
          $links = @{
            desktop = "$env:PUBLIC\Desktop\Freedom Browser.lnk"
            startMenu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Freedom Browser.lnk"
            startup = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\Freedom Browser.lnk"
          }
          foreach ($k in $links.Keys) { if (-not (Test-Path $links[$k])) { throw "Shortcut missing: $k ($($links[$k]))" } }
          Write-Host 'Desktop, Start menu and Startup shortcuts created'
          $s = Start-Process $exe -ArgumentList '--smoke-test' -PassThru -Wait -RedirectStandardOutput installed-smoke.log
          Get-Content installed-smoke.log
          if ($s.ExitCode -ne 0) { throw "Installed app smoke test failed ($($s.ExitCode))" }
          Write-Host "Uninstaller: $un"
          Start-Process $un -ArgumentList '/S', '/allusers' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 2 }
          if (Test-Path $exe) { throw 'Uninstall left the app files' }
          if (Test-Path 'HKLM:\Software\Clients\StartMenuInternet\Freedom Browser') { throw 'Uninstall left the browser registration' }
          foreach ($k in $links.Keys) { if (Test-Path $links[$k]) { throw "Uninstall left the $k shortcut" } }

          # Options: no desktop / Start menu shortcuts when switched off
          $p = Start-Process $setup.FullName -ArgumentList '/S', '/NODESKTOP', '/NOSTARTMENU' -Wait -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $exe); $i++) { Start-Sleep 2 }
          Start-Sleep 5
          if (-not (Test-Path $exe)) { throw 'Second install failed' }
          foreach ($k in $links.Keys) { if (Test-Path $links[$k]) { throw "Shortcut created although switched off: $k" } }
          Write-Host 'Options respected: no shortcuts'
          Start-Process $un -ArgumentList '/S', '/allusers' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 2 }

          # Self-update: runs the updater's own elevation command, in a custom folder, with some shortcuts removed
          $custom = 'C:\FreedomCustom'
          $customExe = "$custom\freedom-browser.exe"
          $p = Start-Process $setup.FullName -ArgumentList '/S', "/D=$custom" -Wait -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $customExe); $i++) { Start-Sleep 2 }
          Start-Sleep 5
          if (-not (Test-Path $customExe)) { throw 'Install to a custom folder failed' }
          Remove-Item $links.desktop
          # What the updater uses to tell an installed copy from a zip
          node -e "process.exit(require('./electron/update-core.cjs').isInstalledCopy(process.argv[1])?0:1)" $custom
          if ($LASTEXITCODE -ne 0) { throw 'The updater does not recognise the installed copy' }
          node -e "process.exit(require('./electron/update-core.cjs').isInstalledCopy(process.argv[1])?1:0)" 'release\win-unpacked'
          if ($LASTEXITCODE -ne 0) { throw 'The updater takes an unpacked copy for an installed one' }
          $env:UPDATE_TEST_SETUP = $setup.FullName
          node -e "const {windowsInstallerCommand:w}=require('./electron/update-core.cjs');const c=w(process.env.UPDATE_TEST_SETUP);const r=require('child_process').spawnSync(c.file,c.args,{env:c.env,stdio:'inherit'});process.exit(r.status)"
          if ($LASTEXITCODE -ne 0) { throw "Update command failed ($LASTEXITCODE)" }
          $running = $null
          for ($i = 0; $i -lt 90 -and -not $running; $i++) {
            Start-Sleep 2
            $running = Get-Process freedom-browser -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $customExe } | Select-Object -First 1
          }
          if (-not $running) { throw 'The update did not start the new version' }
          Write-Host "New version started from $($running.Path)"
          Stop-Process -Name freedom-browser -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $customExe)) { throw 'The update lost the app files' }
          if (Test-Path $links.desktop) { throw 'The update brought back a removed desktop shortcut' }
          if (-not (Test-Path $links.startMenu)) { throw 'The update removed the Start menu shortcut' }
          if ((Test-Path "$env:ProgramFiles\freedom-browser\freedom-browser.exe")) { throw 'The update moved the app out of its custom folder' }
          $unCustom = (Get-ChildItem "$custom\Uninstall *.exe" | Select-Object -First 1).FullName
          Start-Process $unCustom -ArgumentList '/S', '/allusers' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $customExe); $i++) { Start-Sleep 2 }
          Write-Host 'Self-update test passed'
          Write-Host 'Installer test passed'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Freedom-Windows-Binaries
          path: |
            release/*-Setup.exe
            release/*.zip

  publish-release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Freedom-Windows-Binaries
          path: dist-release

      - name: Create checksums
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS-windows.txt

      # The AppImage is built and verified locally before tagging and attached to the
      # release by the maintainer; CI adds the Windows binaries built on a real Windows runner.
      # update.json is signed locally and uploaded last: only then do installed browsers see the release.
      - name: Attach Windows binaries to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-release/*
          # Widevine branch: test builds only, never the latest release, so the update feed does not move
          prerelease: true
          make_latest: 'false'
